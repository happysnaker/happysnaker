name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Weekly drift check for remote support routes and repository metadata.
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile verification scripts
        run: python3 -m py_compile scripts/*.py

      - name: Verify public docs
        run: python3 scripts/verify_public_docs.py --json

      - name: Verify stable profile proof links
        run: python3 scripts/check_stable_profile_links.py

      - name: Verify README badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_readme_badges.py

      - name: Verify CI workflow contract
        run: python3 scripts/check_ci_workflow_contract.py
